<script language="javascript" type="text/javascript">
var _ctlno,_isshowimage;
function _onBodyLoad()
{
    _ctlno=$("[id$=txtRollNo]");
     _isshowimage=true;
    if($(_ctlno).val()!="")
    {
        $("#trRollNo").hide();
         $(_ctlno).hide();
         _isshowimage=false;
        // _onShowClick();
         if($(_ctlno).attr("title")!=null && $(_ctlno).attr("title")!='')
             _showDueBooks();
         else
             _onShowClick();
    }
}
function _onSearchClick()
{
    $(_ctlno).val("");
    $("#btnShow").attr("disabled",false);
    $("#divProfile").html('');
    ShowSearchPage($(_ctlno).attr("id"));
}
function _onCancelClick()
{
    $("#divProfile").html('');
    $(_ctlno).val("");
    $("#btnShow").attr("disabled",false);
    ResizeIFrame();
}
function _onImageClick(o)
{
    var _arr=$(o).attr("src").split("/");
    if(_arr[_arr.length-1]=="plus.jpg")
    {
        var _arrimg=$("img");
        var _div;
        for(var i=0;i<_arrimg.length;i++)
        {
            if($(_arrimg[i]).attr("id").indexOf("imgProfile")>=0)
            {
                $(_arrimg[i]).attr("src","../Images/plus.jpg");
                _div=$("#" + _arrimg[i].id.replace("imgProfile","divProfile"));
                if($(_div).length>0)
                    $(_div).hide();
            } 
        }
        $(o).attr("src","../Images/minus.jpg");
        _div=("#" + $(o).attr("id").replace("imgProfile","divProfile"));
        if($(_div).length>0)
            $(_div).show();
    }
    else
    {
        $(o).attr("src","../Images/plus.jpg");
        _div=$("#" + $(o).attr("id").replace("imgProfile","divProfile"));
        if($(_div).length>0)
            $(_div).hide();
    }    
    ResizeIFrame();
    
}
function _onShowClick()
{
    if ($(_ctlno).attr("name") == "false") {
        if (!checkEmpty($(_ctlno).attr("id"), 'roll number'))
            return false;
    }
    showProcessDialog("divProcess", true);
    setTimeout("profileProcess()", 500);
    
}
function profileProcess() {
    try {
        var _response = StudentProfile.ShowStudentProfileNew($(_ctlno).val(), _isshowimage)
        if (_response.error == null) {
            $("#divProfile").html(_response.value);
            $("#tblReport").accordion({ collapsible: true, active: false, clearStyle: true, autoHeight: false });
            $('#tblReport').bind('accordionchange',
            function () {
                ResizeIFrame();
                //alert('Active tab index: ' + $(this).accordion('option', 'active'))
            });
            //IncreaseIFrameHeight(1000);
            ResizeIFrame();
        }
        else
            Raiserror(_response.error);
    }
    catch (e) {
        alert(e.error);
        hideDialg("divProcess", true);
    }
    hideDialg("divProcess", true);
}
function _showDueBooks()
{
    showProcessDialog("divProcess", true);
    setTimeout("dueBooksProcess()", 500);
}
function dueBooksProcess() {
    try {
        var _result = StudentProfile.ShowLibraryDueBooks($(_ctlno).val());
        if (_result.error == null && _result.value != "") {
            $("#divProcess").html(_result.value);
            showDialogWithPosition("divProcess", 600, 300, "_onCloseWindow()", "Due Books", 0, 0);
        }
        else
            _onShowClick();
    }
    catch (e) {
        alert(e.error);
        hideDialg("divProcess", true);
    }
}
function _onCloseWindow() {
    hideDialg("divProcess", true);
    _onShowClick();
}
function onPrintClick()
{
    $("#tblReport div").show();
    $("#tblReport tr:gt(1)").find("img").hide();
    PrintReport();
    ResizeIFrame();
}
</script>
