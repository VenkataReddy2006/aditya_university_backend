    <script language="javascript" type="text/javascript">
    var _ctlmonth,_ctlyear;
    var _flag,_hdn;
    function _onBodyLoad()
    {
         GetPermissions();
         _flag=false;
        _ctlmonth=$('#ctl00_CapPlaceHolder_ddlMonth');
        _ctlyear=$('#ctl00_CapPlaceHolder_ddlYear');
        _hdn=$('#ctl00_CapPlaceHolder_hdnType');
        if (_hdn.val() == "")
            $("#trRollNo").show();
        
    }
    function _onRadioClick(reporttype)
    {
        $("#trMonth").hide();
        $("#trPeriod").hide();
        if(reporttype=='M')
            $("#trMonth").show();
        else if(reporttype=='P')
            $("#trPeriod").show();
        $("#divReport").html('');
        $("#btnShow").attr("disabled",false);
    }
    function _onCancelClick()
    {
        $("#divReport").html('');
        $("#btnShow").attr("disabled",false);
        ResizeIFrame();
    }
    function _onSearchClick()
    {
        $("#txtRollNo").val('');
        $("#btnShow").attr("disabled",false);
        $("#divReport").html('');
        ShowSearchPage("txtRollNo");
    }
    function _onShowClick() {
        try {
            $("#divReport").html('');
            var _reporttype;
            if ($("#radMonthly").attr("checked"))
                _reporttype = 'M'
            else if ($("#radPeriod").attr("checked"))
                _reporttype = 'P';
            else
                _reporttype = 'T';

            var _monthnyear = '';
            var _result;
            
            var _fdate = "", _tdate = "";
            if (_reporttype == 'M' || _reporttype == 'T') {
                if (_reporttype == 'M') {
                    if (!CheckDropDown(_ctlmonth.attr("id"), 'month'))
                        return false;
                    else if (!CheckDropDown(_ctlyear.attr("id"), 'year'))
                        return false;
                    _fdate = "01/" + _ctlmonth.val() + "/" + _ctlyear.val();
                }
            }
            else if (_reporttype == 'P') {
                if (!DateCheck("txtFromDate", 'from date', true))
                    return false;
                else if (!DateCheck("txtToDate", 'to date', true))
                    return false;

                _fdate = $("#txtFromDate").val();
                _tdate = $("#txtToDate").val();
            }
            callWebMethod({
                url: "studentattendance.aspx/ShowAttendance",
                data: { fromDate: _fdate, toDate: _tdate, excludeothersubjects: $("#chkexclude").attr("checked") },
                success: function (res) {
                    $("#divReport").html(res);
                },
                complete: function () {
                    ResizeIFrame();
                }
            });


           
        }
        catch (e) {
            alert(e.error);
        }
            
    }
   
    </script>
